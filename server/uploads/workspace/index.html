<!-- 
  Login Page with Advanced Neon Styling and Animations
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Login Page</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap">
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #2f4f7f, #3498db);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
    }
    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Login Container Styles */
    .login-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      padding: 40px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2f4f7f, #3498db);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      opacity: 0.5;
      z-index: -1;
    }
    .login-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2f4f7f, #3498db);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      opacity: 0.5;
      z-index: -1;
      filter: blur(10px);
    }

    /* Login Form Styles */
    .login-form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.5);
      font-size: 16px;
      color: #fff;
    }
    .login-form input:focus {
      outline: none;
      border: 1px solid #3498db;
    }
    .login-form button {
      width: 100%;
      padding: 10px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-form button:hover {
      background: #2f4f7f;
    }

    /* Neon Text Styles */
    .neon-text {
      font-size: 24px;
      color: #fff;
      text-align: center;
      text-shadow: 0 0 10px #3498db;
      animation: neon 2s ease infinite;
    }
    @keyframes neon {
      0% {
        text-shadow: 0 0 10px #3498db;
      }
      50% {
        text-shadow: 0 0 20px #3498db;
      }
      100% {
        text-shadow: 0 0 10px #3498db;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1 class="neon-text">Login</h1>
    <form class="login-form">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    // Add event listener to the login form
    const loginForm = document.querySelector('.login-form');
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      // Add your login logic here
      console.log('Login form submitted');
    });
  </script>
</body>
</html>
