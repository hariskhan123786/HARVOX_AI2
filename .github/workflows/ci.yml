name: HARVOX AI — Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }} Env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client & Server Workspace Dependencies
        run: npm run install:all

      - name: Run Automated Quality Unit Tests
        run: npm run test

      - name: Verify Client Workspace Bundling Build
        run: |
          cd client
          npm run build
